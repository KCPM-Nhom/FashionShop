name: CI Pipeline - FashionShop

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    name: 🧪 Kiểm tra code
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fashionshop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, mbstring

      - name: Kiểm tra syntax tất cả file PHP
        run: |
          echo "🔍 Đang kiểm tra syntax PHP..."
          find . -name "*.php" | while read file; do
            php -l "$file" || exit 1
          done
          echo "✅ Tất cả file PHP hợp lệ!"

      - name: Kiểm tra file quan trọng tồn tại
        run: |
          test -f index.php           && echo "✅ index.php OK"          || (echo "❌ Thiếu index.php" && exit 1)
          test -f config/database.php && echo "✅ database.php OK"       || (echo "❌ Thiếu database.php" && exit 1)
          test -f .env.example        && echo "✅ .env.example OK"       || (echo "❌ Thiếu .env.example" && exit 1)
          test -f Dockerfile          && echo "✅ Dockerfile OK"         || (echo "❌ Thiếu Dockerfile" && exit 1)
          test -f docker-compose.yml  && echo "✅ docker-compose.yml OK" || (echo "❌ Thiếu docker-compose.yml" && exit 1)

      - name: Kiểm tra kết nối DB
        run: |
          php -r "
            \$conn = mysqli_connect('127.0.0.1', 'root', 'root', 'fashionshop_test', 3306);
            if (\$conn) {
              echo '✅ Kết nối DB thành công' . PHP_EOL;
              mysqli_close(\$conn);
            } else {
              echo '❌ Kết nối DB thất bại: ' . mysqli_connect_error() . PHP_EOL;
              exit(1);
            }
          "
